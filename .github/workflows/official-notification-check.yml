name: Automatic Official Notification Check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-notification-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check official sources
        run: node scripts/check-official-notifications.mjs

      - name: Commit changed official feed
        run: |
          if git diff --quiet -- lib/auto-notifications.ts; then
            echo "No official-feed change detected."
            exit 0
          fi
          git config user.name "sarkariprep-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/auto-notifications.ts
          git commit -m "chore: refresh official notification feed"
          git push
