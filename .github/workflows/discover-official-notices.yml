# v2 - resilient discovery run
name: Discover official recruitment notices

on:
  push:
    paths:
      - "scripts/discover-official-notices.mjs"
      - "config/official-sources.json"
      - ".github/workflows/discover-official-notices.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-notice-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover official notices
        run: node scripts/discover-official-notices.mjs

      - name: Commit discovery feed
        run: |
          git config user.name "sarkariprep-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/discover-official-notices.mjs
            git add lib/discovered-official-notices.ts
            if git diff --cached --quiet; then
              echo "No discovery changes."
              exit 0
            fi
            git commit -m "chore: refresh discovered official notices"
            if git push origin HEAD:main; then
              echo "Discovery feed pushed successfully."
              exit 0
            fi
            echo "Push race detected; retrying from latest origin/main..."
            git reset --hard HEAD~1
            sleep 2
          done
          echo "Could not publish discovery feed after 3 attempts."
          exit 1
