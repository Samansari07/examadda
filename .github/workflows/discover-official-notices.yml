name: Discover official recruitment notices

on:
  push:
    paths:
      - "scripts/discover-official-notices.mjs"
      - "config/official-sources.json"
      - ".github/workflows/discover-official-notices.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-notice-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover official notices
        run: node scripts/discover-official-notices.mjs

      - name: Commit discovery feed
        run: |
          if git diff --quiet -- lib/discovered-official-notices.ts; then
            echo "No discovery changes."
            exit 0
          fi
          git config user.name "sarkariprep-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/discovered-official-notices.ts
          git commit -m "chore: refresh discovered official notices"
          git push
