name: Sync official notifications

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan official sources
        run: node scripts/sync-official-notifications.mjs
      - name: Commit changes
        run: |
          git config user.name "SarkariPrep Official Sync"
          git config user.email "actions@users.noreply.github.com"
          git add lib/auto-notifications.ts
          if git diff --cached --quiet; then
            echo "No notification changes."
          else
            git commit -m "chore: sync official notifications"
            git push
          fi
