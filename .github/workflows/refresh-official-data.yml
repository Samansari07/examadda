# v5 - isolate refresh concurrency so a stale queued run cannot block a fresh scan
name: Refresh official exam data

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "lib/exams.ts"
      - ".github/workflows/refresh-official-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

# Use a workflow/ref-specific group. The old literal group could leave a stale
# queued run blocking the fresh scan. GitHub documents that concurrency groups
# can keep a run pending when another run uses the same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight aggregation scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check aggregation pipeline
        run: |
          node --check scripts/aggregate-official-data.mjs
          node --check scripts/check-official-batch.mjs
          node --experimental-strip-types --check scripts/validate-exam-lifecycle.mjs

  scan:
    needs: preflight
    name: Scan official sources batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: [0,1,2,3,4,5,6,7]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install PDF extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          sudo apt-get install -y -qq curl
      - name: Syntax check official checker
        run: node --check scripts/check-official-batch.mjs
      - name: Scan batch
        id: scan
        continue-on-error: true
        timeout-minutes: 20
        env:
          SOURCE_BATCH: ${{ matrix.batch }}
          SOURCE_BATCH_COUNT: 8
        run: node scripts/check-official-batch.mjs
      - name: Preserve batch artifact on transient scan failure
        if: ${{ always() }}
        env:
          SOURCE_BATCH: ${{ matrix.batch }}
          SOURCE_BATCH_COUNT: 8
        run: |
          mkdir -p official-refresh-batches
          if [ ! -s "official-refresh-batches/batch-${SOURCE_BATCH}.json" ]; then
            node -e 'const fs=require("fs"); const cfg=JSON.parse(fs.readFileSync("config/official-sources.json","utf8")); const batch=Number(process.env.SOURCE_BATCH); const count=Number(process.env.SOURCE_BATCH_COUNT); const selected=cfg.filter((_,i)=>i%count===batch); const today=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"}); const statuses=selected.map(s=>({id:s.id,organization:s.organization,category:s.category,region:s.region,sourceUrl:s.updatesUrl,ok:false,health:"unreachable",detected:0,lastChecked:today,error:"Batch scan did not produce a result; preserved as unavailable for this refresh cycle."})); fs.writeFileSync("official-refresh-batches/batch-"+batch+".json",JSON.stringify({batch,sourceCount:selected.length,results:[],statuses,failures:statuses.map(s=>({source:s.organization,error:s.error})),overrides:{}},null,2)); console.log("Fallback batch artifact created:",batch,statuses.length);'
          fi
      - name: Upload batch result
        uses: actions/upload-artifact@v7
        with:
          name: official-batch-${{ matrix.batch }}
          path: official-refresh-batches/batch-${{ matrix.batch }}.json
          if-no-files-found: error
          retention-days: 3

  aggregate:
    name: Aggregate official data
    needs: scan
    if: ${{ always() && needs.scan.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download batch results
        uses: actions/download-artifact@v7
        with:
          pattern: official-batch-*
          path: official-refresh-batches
          merge-multiple: true
      - name: Validate batch coverage
        run: |
          count=$(find official-refresh-batches -name 'batch-*.json' | wc -l)
          echo "Batch files: $count"
          test "$count" -eq 8
          node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('config/official-sources.json','utf8')); const ids=new Set(); for(const file of fs.readdirSync('official-refresh-batches').filter(x=>/^batch-[0-9]+\\.json$/.test(x))){const p=JSON.parse(fs.readFileSync('official-refresh-batches/'+file,'utf8')); for(const s of (p.statuses||[])) ids.add(s.id)} const missing=cfg.map(x=>x.id).filter(x=>!ids.has(x)); if(missing.length){console.error('Missing source statuses:',missing); process.exit(1)} console.log('Source coverage OK:',ids.size+'/'+cfg.length);"
      - name: Aggregate
        run: |
          node --check scripts/aggregate-official-data.mjs
          node --check scripts/check-official-batch.mjs
          node scripts/aggregate-official-data.mjs
          node scripts/validate-notice-feed.mjs
          node scripts/validate-auto-data-integrity.mjs
          node --experimental-strip-types scripts/validate-exam-lifecycle.mjs
          node --check scripts/check-official-batch.mjs
          node --check scripts/aggregate-official-data.mjs
          test -s lib/auto-notifications.ts
          test -s lib/auto-exam-data.ts
          test -s lib/source-status.ts
          test -s lib/discovered-official-notices.ts
          node -e "const fs=require('fs'); const s=fs.readFileSync('lib/source-status.ts','utf8'); if(!s.includes('health')) process.exit(1);"
      - name: Commit refreshed data
        run: |
          git config user.name "SarkariPrep Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/aggregate-official-data.mjs
            node scripts/validate-notice-feed.mjs
            node scripts/validate-auto-data-integrity.mjs
            node --experimental-strip-types scripts/validate-exam-lifecycle.mjs
            git add lib/auto-notifications.ts lib/auto-exam-data.ts lib/source-status.ts lib/discovered-official-notices.ts
            if git diff --cached --quiet; then
              echo "No official-data changes detected."
              exit 0
            fi
            git commit -m "chore: refresh official exam data"
            if git push origin HEAD:main; then
              echo "Official data pushed successfully."
              exit 0
            fi
            echo "Push race detected; retrying from latest origin/main..."
            git reset --hard HEAD~1
            sleep 2
          done
          echo "Could not publish official data after 3 attempts."
          exit 1
