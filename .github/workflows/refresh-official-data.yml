name: Refresh official exam data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: official-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PDF extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Refresh official sources
        run: node scripts/check-official-notifications.mjs

      - name: Validate generated files
        run: |
          node --check scripts/check-official-notifications.mjs
          test -s lib/auto-notifications.ts
          test -s lib/auto-exam-data.ts
          test -s lib/source-status.ts

      - name: Commit refreshed data
        run: |
          git config user.name "SarkariPrep Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/auto-notifications.ts lib/auto-exam-data.ts lib/source-status.ts
          if git diff --cached --quiet; then
            echo "No official-data changes detected."
          else
            git commit -m "chore: refresh official exam data"
            git push origin main
          fi
